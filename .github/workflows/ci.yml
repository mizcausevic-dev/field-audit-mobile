name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kotlin-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test
        run: ./gradlew test
      - name: Demo
        run: ./gradlew run --args=demo
      - name: Prerender
        run: ./gradlew run --args=prerender
      - name: Smoke
        run: ./gradlew run --args=smoke
