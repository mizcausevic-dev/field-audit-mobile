name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kotlin-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test
        run: ./gradlew test
      - name: Demo
        run: ./gradlew run --args=demo
      - name: Prerender
        run: ./gradlew run --args=prerender
      - name: Smoke
        run: ./gradlew run --args=smoke
