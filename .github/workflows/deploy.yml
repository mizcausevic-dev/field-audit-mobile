name: Deploy to field.kineticgain.com

# Kotlin (Gradle) -> Hostinger FTP at /field/
# workflow_dispatch-only: subdomain isn't in Hostinger DNS yet.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-field-audit-mobile
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build + FTP-sync to field.kineticgain.com
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prerender via Gradle
        run: ./gradlew run --args=prerender
      - name: Verify build output
        run: |
          test -d site || (echo "FAIL: site/ missing" && exit 1)
          test -f site/index.html || (echo "FAIL: site/index.html missing" && exit 1)
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: /field/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
